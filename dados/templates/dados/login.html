{% load static %}<!doctype html>
<html lang="pt-br">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Entrar · TR Motors</title>
<link rel="icon" href="{% static 'dados/logo-tr.png' %}">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{% static 'dados/painel.css' %}">
<style>
  body{display:grid;place-items:center;min-height:100vh;padding:20px;background:linear-gradient(160deg,#17140f,#0b0a08)}
  .box{width:100%;max-width:380px;background:#fff;border-radius:20px;padding:32px 30px;box-shadow:0 30px 80px rgba(0,0,0,.45)}
  .box img{width:56px;height:56px;border-radius:14px;display:block;margin:0 auto 14px}
  .box h1{text-align:center;font-size:20px;letter-spacing:-.3px;margin-bottom:4px}
  .box p.s{text-align:center;color:var(--muted);font-size:12.5px;margin-bottom:22px}
  label{display:block;font-size:12px;font-weight:500;margin:14px 0 6px;color:#59527a}
  input{width:100%;border:1px solid #e7e0cf;background:#faf7f0;border-radius:11px;padding:12px 14px;font:inherit;outline:0}
  input:focus{border-color:#f5a623;box-shadow:0 0 0 3px #f5a62333}
  button{width:100%;margin-top:22px;border:0;border-radius:11px;background:#f5a623;color:#1a1200;font:inherit;font-weight:600;padding:13px;cursor:pointer}
  button:hover{background:#e29a1b}
  .err{background:var(--red-soft);color:var(--red);border-radius:10px;padding:10px 12px;font-size:12px;margin-bottom:6px}
</style>
</head>
<body>
<form class="box" method="post">{% csrf_token %}
  <img src="{% static 'dados/logo-tr.png' %}" alt="TR Motors">
  <h1>TR Motors</h1>
  <p class="s">Entre para acessar o painel da revenda</p>
  {% if form.errors %}<div class="err">Usuário ou senha incorretos.</div>{% endif %}
  <label for="id_username">Usuário</label>
  <input id="id_username" name="username" autocomplete="username" autofocus required>
  <label for="id_password">Senha</label>
  <input id="id_password" name="password" type="password" autocomplete="current-password" required>
  <input type="hidden" name="next" value="{{ next }}">
  <button type="submit">Entrar</button>
</form>
</body>
</html>
